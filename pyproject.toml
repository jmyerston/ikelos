[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pymorpheus"
version = "0.1.0.dev0"
description = "Pure-Python port of the Morpheus Ancient Greek morphological analyzer"
keywords = ["ancient greek", "morphology", "lemmatization", "morpheus", "nlp"]
readme = "README.md"
license = "MPL-2.0"
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://github.com/jmyerston/pymorpheus"
"Original C Morpheus" = "https://github.com/perseids-tools/morpheus"

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
pymorpheus = "pymorpheus.cli:main"

[tool.setuptools.packages.find]
include = ["pymorpheus*"]

[tool.setuptools.package-data]
pymorpheus = ["data/**/*"]
